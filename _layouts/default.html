<!DOCTYPE html>
<html>
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>

    {% include meta.html %}

    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />

  </head>

  <body>
    <div id="bighead">
      <div class="container">
        <div id="h1-nav-wrapper">
          <h1><a href="{{ site.baseurl }}/">{{ site.name }}</a></h1>
          <nav>
            <ul>
              <li><a href="{{ site.baseurl }}/blog/">Blog</a></li>
              <li><a href="{{ site.baseurl }}/qna/">Q&A</a></li>
              <li><a href="{{ site.baseurl }}/hire-me/">Hire me</a></li>
              <li><button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">🌙</button></li>
            </ul>
          </nav>
        </div>
      </div>
    </div>

    <div id="wrapper">
      <div id="main" role="main" class="container">
        <form action="{{ site.baseurl }}/search/" method="GET" class="search-form">
          <input type="search" placeholder="Search this site..." class="search-input" name="q">
          <button type="submit" class="search-submit">Search</button>
        </form>
        {{ content }}
      </div>
    </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>

    <script>
      (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'light') {
          document.body.classList.add('light-mode');
        }
      })();

      const themeToggle = document.getElementById('theme-toggle');
      themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        themeToggle.textContent = isLight ? '☀️' : '🌙';
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
      });
    </script>

    {% include analytics.html %}
  </body>
</html>
