---
layout: default
---

<div class="posts">
  <h2 class="overband">Latest Entries</h2>
  {% for post in site.posts %}
    <div class="entry segment">
      <h3><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h3>
      <p>{{ post.excerpt }}</p>
      <div class="entryFooter">
        <a href="{{ site.baseurl }}{{ post.url }}" title="Permalink for &quot;{{ post.title }}&quot;">{{ post.date }}</a>
      </div>
    </div>
  {% endfor %}
</div>
